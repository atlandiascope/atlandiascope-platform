name: Platform checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          node --check netlify/functions/_shared/auth.mjs
          node --check netlify/functions/platform-me.mjs
          node --check netlify/functions/platform-products.mjs
